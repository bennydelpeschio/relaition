<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelAItion · Dimostrazione guidata</title>
<style>
  /* La demo NON eredita nulla dall'app: l'app vive dentro il riquadro e resta
     intatta. Questi stili valgono solo per il palco che le sta intorno. */
  :root{
    --sfondo:#0B1220; --carta:#FFFFFF; --testo:#0F172A; --testo2:#475569;
    --testo3:#64748B; --bordo:#E2E8F0; --acc:#2563EB; --acc-l:#EFF6FF; --viola:#7C3AED;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--sfondo);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  #app{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

  /* Il faretto è un'ombra enorme: oscura tutto tranne il ritaglio, senza dover
     disegnare quattro pannelli attorno all'elemento. */
  #faretto{position:fixed;border-radius:10px;pointer-events:none;z-index:40;display:none;
    box-shadow:0 0 0 9999px rgba(8,15,30,.55), 0 0 0 2px var(--acc) inset;
    transition:all .26s cubic-bezier(.22,1,.36,1)}

  #narrazione{position:fixed;z-index:50;width:370px;max-width:calc(100vw - 24px);
    background:var(--carta);border-radius:14px;padding:15px 17px;display:none;
    box-shadow:0 18px 50px rgba(2,8,23,.35);transition:left .26s cubic-bezier(.22,1,.36,1),top .26s cubic-bezier(.22,1,.36,1)}
  /* Mentre inseguono lo scorrimento, faretto e riquadro si muovono senza
     transizione: una transizione di 0,4s significa arrivare 0,4s dopo il
     contenuto, che e' esattamente il ritardo che si vedeva. La transizione
     resta per il salto da un bersaglio all'altro, dove serve. */
  #faretto.segue,#narrazione.segue{transition:none}
  #nCapitolo{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
  #nTitolo{font-size:15px;font-weight:800;color:var(--testo);margin:3px 0 6px;line-height:1.3}
  #nTesto{font-size:12.5px;color:var(--testo2);line-height:1.65}
  #nTesto strong{color:var(--testo)}
  #nTesto em{color:var(--viola);font-style:normal;font-weight:600}
  .barra{height:4px;background:#EEF2F7;border-radius:3px;margin-top:12px;overflow:hidden}
  .barra > div{height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .35s}
  #nContatore{font-size:10px;color:var(--testo3);margin-top:6px;text-align:right}

  /* Puntatore finto: senza, nel video le cose accadrebbero senza causa visibile. */
  #cursore{position:fixed;z-index:60;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:rgba(37,99,235,.28);border:2px solid var(--acc);
    pointer-events:none;opacity:0;transition:transform .45s cubic-bezier(.4,0,.2,1),opacity .3s}
  .onda{position:fixed;z-index:59;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:2px solid var(--acc);pointer-events:none;animation:onda .7s ease-out forwards}
  @keyframes onda{to{width:64px;height:64px;margin:-32px 0 0 -32px;opacity:0}}

  #comandi{position:fixed;z-index:95;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;align-items:center;background:rgba(15,23,42,.92);
    padding:7px 9px;border-radius:12px;box-shadow:0 10px 30px rgba(2,8,23,.4)}
  /* Maniglia di ritorno: esiste solo mentre i comandi sono nascosti, resta
     trasparente finché il mouse è fermo e compare al primo movimento. */
  #riapri{position:fixed;z-index:95;bottom:16px;left:50%;transform:translateX(-50%);
    display:none;background:rgba(15,23,42,.82);color:#CBD5E1;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:6px 12px;font-size:11px;font-family:inherit;cursor:pointer;
    backdrop-filter:blur(6px);opacity:0;transition:opacity .25s;pointer-events:none}
  #riapri.visibile{opacity:.9;pointer-events:auto}
  #riapri:hover{opacity:1;background:rgba(15,23,42,.95)}
  #comandi button{background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:8px;
    min-width:34px;height:32px;padding:0 10px;font-size:13px;cursor:pointer;font-weight:600}
  #comandi button:hover{background:rgba(255,255,255,.22)}
  #comandi .sep{width:1px;height:20px;background:rgba(255,255,255,.18)}
  #comandi .aiuto{color:#94A3B8;font-size:10.5px;padding:0 6px;line-height:1.35}

  #pannelloIndice{position:fixed;z-index:95;left:16px;bottom:64px;width:250px;
    background:rgba(15,23,42,.95);border-radius:12px;padding:9px;display:none;
    box-shadow:0 14px 40px rgba(2,8,23,.45);max-height:60vh;overflow:auto}
  #pannelloIndice h4{color:#fff;font-size:11px;margin:4px 6px 8px;font-weight:800;
    text-transform:uppercase;letter-spacing:.05em}
  .voce{display:flex;gap:8px;align-items:center;color:#CBD5E1;font-size:11.5px;
    padding:6px 8px;border-radius:7px;cursor:pointer}
  .voce:hover{background:rgba(255,255,255,.1);color:#fff}
  .voce.attiva{background:var(--acc);color:#FFFFFF;font-weight:700}
  .voce .num{font-size:10px;opacity:.75;min-width:16px}

  #avvio{position:fixed;inset:0;z-index:90;background:var(--sfondo);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#fff}
  #avvio .marchio{display:flex;align-items:center;gap:12px}
  #avvio .tessera{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(135deg,#2563EB,#7C3AED);box-shadow:0 4px 14px rgba(37,99,235,.35)}
  #avvio .tessera{background:none;box-shadow:none;width:auto;height:auto;filter:drop-shadow(0 6px 16px rgba(79,70,229,.5))}
  #avvio .claim{display:inline-flex;gap:.45em;font-size:12px;font-weight:600;letter-spacing:.14em;margin-top:6px}
  #avvio .claim span:nth-child(1){color:#818CF8}#avvio .claim span:nth-child(3){color:#A5B4FC}#avvio .claim span:nth-child(5){color:#C4B5FD}#avvio .claim span:nth-child(7){color:#D8B4FE}#avvio .claim i{font-style:normal;color:#64748B}
  #avvio .logo{font-size:26px;font-weight:800;letter-spacing:-.02em}
  #avvio .sub{color:#94A3B8;font-size:13px;max-width:440px;text-align:center;line-height:1.6}
  .puntini{display:flex;gap:5px;margin-top:6px}
  .puntini span{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:salta 1s infinite}
  .puntini span:nth-child(2){animation-delay:.15s}
  .puntini span:nth-child(3){animation-delay:.3s}
  @keyframes salta{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>

<iframe id="app" src="../index.html" title="RelAItion"></iframe>

<div id="faretto"></div>
<div id="cursore"></div>

<div id="narrazione">
  <div id="nCapitolo"></div>
  <div id="nTitolo"></div>
  <div id="nTesto"></div>
  <div class="barra"><div id="nProgresso"></div></div>
  <div id="nContatore"></div>
</div>

<div id="pannelloIndice">
  <h4>Capitoli</h4>
  <div id="indice"></div>
</div>

<!-- Maniglia di ritorno. Esiste solo mentre i comandi sono nascosti, resta
     invisibile finché il mouse è fermo e compare al primo movimento: chi
     registra non se la ritrova nel video, chi ha premuto ✕ per sbaglio la
     trova subito. Nascondere qualcosa senza lasciare la strada del ritorno
     e' l'unico modo sbagliato di farlo. -->
<button id="riapri" onclick="alternaComandi()" title="Rimostra i comandi (H)">⌃ comandi</button>
<div id="comandi">
  <button onclick="alternaIndice()" title="Indice dei capitoli (I)">☰</button>
  <div class="sep"></div>
  <button onclick="indietro()" title="Passo precedente (←)">◀</button>
  <button id="bPlay" onclick="riproduci()" title="Riproduci da sola (P)">▶</button>
  <button onclick="avanti()" title="Passo successivo (→ o spazio)">▶▶</button>
  <div class="sep"></div>
  <button id="bVel" onclick="cambiaVelocita()" title="Velocità">1×</button>
  <button onclick="ricomincia()" title="Ricomincia da capo">⟲</button>
  <button onclick="alternaComandi()" title="Nascondi i comandi (H), riappaiono muovendo il mouse">✕</button>
  <div class="aiuto">→ avanti · P riproduci<br>H nascondi · I capitoli</div>
</div>

<div id="avvio">
  <div class="marchio">
    <img src="../brand/logo-dark.png" alt="RelAItion" style="width:300px;max-width:80vw;display:block;margin:0 auto 8px">
  </div>
  <div class="sub">Sto preparando la dimostrazione e fotografando lo stato della piattaforma,
    per poterlo rimettere identico alla fine.</div>
  <div class="puntini"><span></span><span></span><span></span></div>
</div>

<script src="copione.js"></script>
<script src="motore.js"></script>
</body>
</html>
