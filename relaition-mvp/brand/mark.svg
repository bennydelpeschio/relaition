<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Marchio RelAItion: un triangolo arrotondato (vertici in alto, in basso a
       sinistra e a destra) reso come tre petali semitrasparenti leggermente
       ruotati, dal blu al viola, con «AI» al centro. Ricostruito in
       vettoriale dal foglio di identita' (palette #4F46E5 #6366F1 #A855F7
       #E9E7FF #0F172A). -->
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="p2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="p3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
  </defs>
  <!-- Il tratto spesso a giunzione tonda e' cio' che arrotonda gli spigoli. -->
  <g stroke-linejoin="round" stroke-width="80">
    <path d="M236 110 L122 366 L408 318 Z" fill="url(#p3)" stroke="url(#p3)" opacity=".75" transform="rotate(-14 256 256)"/>
    <path d="M236 110 L122 366 L408 318 Z" fill="url(#p2)" stroke="url(#p2)" opacity=".8" transform="rotate(14 256 256)"/>
    <path d="M236 110 L122 366 L408 318 Z" fill="url(#p1)" stroke="url(#p1)" opacity=".92"/>
  </g>
  <text x="256" y="312" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="150" font-weight="800" fill="#FFFFFF" letter-spacing="-4">AI</text>
</svg>
